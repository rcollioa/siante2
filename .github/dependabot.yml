# Dependabot abre un PR semanal por grupo. Las alertas de seguridad se activan aparte en
# Settings > Code security y abren PR apenas se publica el aviso.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Spring Boot fija las versiones de casi todo lo demás (Hibernate, Jackson, Tomcat...) con su BOM:
      # se actualiza junto, no dependencia por dependencia.
      spring-boot:
        patterns: ["org.springframework.boot:*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Los paquetes de Angular deben quedar en la misma versión entre sí.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      lint-y-tests:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "vitest", "jsdom"]
      fuentes:
        patterns: ["@fontsource/*"]
    ignore:
      # Node y TypeScript se suben a mano: cambian el entorno de build (.nvmrc, Dockerfile) y la
      # compatibilidad con Angular.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Imágenes base de los Dockerfile (Maven, Temurin, Node, nginx).
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Sin saltos de versión mayor: Java y Node se quedan en su LTS (25 y 22) hasta decidir el cambio.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
