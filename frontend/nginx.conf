server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Sin la versión de nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;
    # Redirecciones relativas: detrás del ingress (HTTPS, otro puerto) nginx no conoce el esquema ni
    # el puerto públicos, y una redirección absoluta mandaría a http://host:80/...
    absolute_redirect off;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    # El ingress no comprime; gzip_proxied any porque todo llega por el ingress.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # La app se publica bajo /siante2/ (baseHref de angular.json); la raíz redirige ahí.
    location = / {
        return 302 /siante2/;
    }

    # index.html siempre se revalida, así el navegador ve los nombres nuevos tras un despliegue.
    location /siante2/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /siante2/index.html;
    }

    # JS, CSS y fuentes con hash en el nombre (outputHashing): si cambian, cambia el nombre; se guardan
    # un año. Solo en la raíz y en media/. Los chunks diferidos usan un hash con minúsculas, - y _.
    location ~ "^/siante2/(media/)?[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
