# Incluir también en cada location con add_header propio (nginx no los hereda). Angular exige
# 'unsafe-inline' en style-src; un origen externo (p. ej. mapas) va en img-src/connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Para navegadores sin soporte de frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS no va aquí: lo agrega el ingress, que es el que termina HTTPS.
