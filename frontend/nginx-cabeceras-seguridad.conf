# Cabeceras de seguridad de todas las respuestas del frontend. Se incluyen en `server` y además en cada
# `location` que tenga su propio add_header: nginx no hereda los add_header del nivel superior en un
# bloque que define alguno, así que sin el include esas respuestas saldrían sin estas cabeceras.
#
# CSP: todo desde el propio origen (las fuentes son de @fontsource, no de Google Fonts).
# - style-src 'unsafe-inline': Angular inserta los estilos de cada componente como <style> en tiempo de
#   ejecución. Quitarlo requiere un nonce por respuesta (ngCspNonce).
# - script-src sin 'unsafe-inline': por eso angular.json desactiva inlineCritical, que agrega un
#   onload="..." inline a la hoja de estilos.
# - img-src data:: imágenes embebidas en CSS o SVG.
# Si el proyecto suma un origen externo (un servicio de mapas, una API de otro dominio), agregarlo a la
# directiva que corresponda (img-src, connect-src...).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Para navegadores sin soporte de frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS no va aquí: lo agrega el ingress, que es el que termina HTTPS.
