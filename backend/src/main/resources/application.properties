spring.application.name=backend

# En local, lee el .env de la raíz (ejecutando desde backend/ o desde la raíz); en Docker y k8s no existe.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Conexión a la base: la entrega el ambiente (secreto de k8s o archivo .env en local). No guardar
# credenciales en el repositorio.
spring.datasource.url=${SIANTE_DATASOURCE_URL:}
spring.datasource.username=${SIANTE_DATASOURCE_USERNAME:}
spring.datasource.password=${SIANTE_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SIANTE_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
spring.datasource.hikari.maximum-pool-size=${SIANTE_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SIANTE_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SIANTE_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

# Hibernate no crea ni valida el esquema: las tablas y vistas las administra la base, no la aplicación.
spring.jpa.hibernate.ddl-auto=none
# Sin sesión de Hibernate abierta hasta el final de la respuesta HTTP: solo escondería consultas N+1
# y dejaría conexiones tomadas de más. Cada caso de uso carga lo que necesita.
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}

# Gzip en el origen porque el ingress no comprime; solo sobre min-response-size.
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json
server.compression.min-response-size=2KB

# Cache-Control de las respuestas GET exitosas de la API (ver CacheControlAdvice). Duración ISO-8601;
# PT0S desactiva el caché del navegador.
app.cache.max-age=${CACHE_MAX_AGE:PT5M}

# Prefijo de todas las rutas de la API (ver ApiPrefijoConfig). Va fijo y no por variable de entorno
# porque el frontend (API_PREFIJO), los proxy.conf*.json y los ingress de k8s deben coincidir con él.
app.api.prefijo=/siante2/api

# Contrato OpenAPI en <prefijo>/openapi (ApiPrefijoConfig agrega el prefijo); en prod se desactiva.
springdoc.api-docs.path=/openapi
springdoc.api-docs.enabled=${APP_OPENAPI_ENABLED:true}
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Orígenes que pueden llamar a la API desde otro dominio, separados por coma (ver CorsConfig). Vacío:
# ninguno.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
