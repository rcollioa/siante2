spring.application.name=backend

# Perfil por omisión: local (application-local.properties). En k8s, SPRING_PROFILES_ACTIVE=dev o prod.
spring.profiles.default=local

# Hilos virtuales (Java 25): cada solicitud espera a Oracle o a un servicio externo sin ocupar un hilo
# del sistema. La concurrencia hacia la base la sigue limitando el pool de Hikari.
spring.threads.virtual.enabled=true

# Cada línea de log lleva la solicitud (SolicitudFilter) y el usuario (IdentidadWebSealFilter).
logging.pattern.correlation=[%X{solicitud:-}] [%X{usuario:-}] 
logging.level.siante2=${LOG_LEVEL_SIANTE2:INFO}

# Conexión a la base: la entrega el ambiente (secreto de k8s o archivo .env en local). No guardar
# credenciales en el repositorio.
spring.datasource.url=${SIANTE_DATASOURCE_URL:}
spring.datasource.username=${SIANTE_DATASOURCE_USERNAME:}
spring.datasource.password=${SIANTE_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SIANTE_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
spring.datasource.hikari.maximum-pool-size=${SIANTE_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SIANTE_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SIANTE_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

# Hibernate no crea ni valida el esquema: las tablas y vistas las administra la base, no la aplicación.
spring.jpa.hibernate.ddl-auto=none
# Sin sesión de Hibernate abierta hasta el final de la respuesta HTTP: solo escondería consultas N+1
# y dejaría conexiones tomadas de más. Cada caso de uso carga lo que necesita.
spring.jpa.open-in-view=false

# Oracle trae 10 filas por viaje a la base: 100 reduce los viajes en listados.
spring.jpa.properties.hibernate.jdbc.fetch_size=100
# Inserciones y actualizaciones en lotes, agrupadas por tabla.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Colecciones y asociaciones LAZY se cargan de a 50 en una consulta (evita N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# IN (...) con largos potencia de 2: Oracle reutiliza el plan en vez de uno por cantidad de valores.
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# Falla en vez de paginar en memoria un fetch de colección (traería todas las filas).
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
# Consultas lentas al log, con su SQL (ms).
spring.jpa.properties.hibernate.log_slow_query=${SIANTE_LOG_CONSULTA_LENTA_MS:1000}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
# Salud e info quedan abiertas para k8s; metrics exige usuario (SeguridadConfig).
management.info.env.enabled=true
info.app.nombre=SIANTE
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}

# Gzip en el origen porque el ingress no comprime; solo sobre min-response-size.
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json
server.compression.min-response-size=2KB

# Cache-Control de las respuestas GET exitosas de la API (ver CacheControlAdvice). Duración ISO-8601;
# PT0S desactiva el caché del navegador.
app.cache.max-age=${CACHE_MAX_AGE:PT5M}

# Prefijo de todas las rutas de la API (ver ApiPrefijoConfig). Va fijo y no por variable de entorno
# porque el frontend (API_PREFIJO), los proxy.conf*.json y los ingress de k8s deben coincidir con él.
app.api.prefijo=/siante2/api

# Contrato OpenAPI en <prefijo>/openapi (ApiPrefijoConfig agrega el prefijo); prod lo desactiva.
springdoc.api-docs.path=/openapi
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Orígenes que pueden llamar a la API desde otro dominio, separados por coma (ver CorsConfig). Vacío:
# ninguno.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
