# Reemplaza a src/main/resources/application.properties en los tests: el contexto completo
# (ContextoAplicacionTest) arranca contra H2 en memoria, sin Oracle. MODE=Oracle acerca la sintaxis de
# H2 a la de Oracle, pero no la iguala: las consultas nativas se prueban contra la base real.
spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:siante2;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.api.prefijo=/siante2/api
