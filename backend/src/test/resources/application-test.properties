# Perfil test (lo activa surefire): se suma a src/main/resources/application.properties y solo
# cambia la base por H2 en memoria. MODE=Oracle acerca la sintaxis, pero no cubre las consultas nativas.
spring.datasource.url=jdbc:h2:mem:siante2;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Estadísticas para que los tests cuenten sentencias SQL (ContadorSql); sin el log por sesión.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
