services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siante2-backend
    ports:
      - "${SIANTE_PUERTO_BACKEND:-8080}:8080"
      # Actuator (salud, info, métricas) en local.
      - "${SIANTE_PUERTO_ADMIN:-8081}:8081"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: siante2-frontend
    ports:
      - "${SIANTE_PUERTO_FRONTEND:-4200}:4200"
    command: npm start -- --proxy-config src/proxy.conf.docker.json
    depends_on:
      - backend
