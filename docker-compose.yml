services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siante2-backend
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: siante2-frontend
    ports:
      - "4200:4200"
    command: npm start -- --proxy-config src/proxy.conf.docker.json
    depends_on:
      - backend
