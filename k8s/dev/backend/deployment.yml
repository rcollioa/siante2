apiVersion: apps/v1
kind: Deployment
metadata:
  name: siante2-backend-test
  namespace: siante2-test
  labels:
    app: siante2-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siante2-backend-test
  template:
    metadata:
      labels:
        app: siante2-backend-test
    spec:
      # Sin token de la API de Kubernetes montado: la aplicación no la usa.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr.io
      containers:
        - name: backend
          image: ghcr.io/cgr-chile/siante2-backend
          imagePullPolicy: IfNotPresent
          # Sistema de archivos de solo lectura y sin privilegios: si alguien llega a ejecutar código en el
          # contenedor, no puede modificar la aplicación ni escalar a root. Solo /tmp es escribible.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: siante2-config
            - secretRef:
                name: siante2-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          # Spring Boot tarda en arrancar: hasta 30 x 5 s = 150 s antes de evaluar las otras probes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness no mira la base: reiniciar el pod no la arregla y su caída ya responde 503.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # Con readOnlyRootFilesystem, la JVM (hsperfdata) y Tomcat embebido escriben en /tmp.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
