apiVersion: apps/v1
kind: Deployment
metadata:
  name: siante2-frontend-test
  namespace: sisgeob-test
  labels:
    app: siante2-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siante2-frontend-test
  template:
    metadata:
      labels:
        app: siante2-frontend-test
    spec:
      imagePullSecrets:
        - name: ghcr.io
      containers:
        - name: frontend
          image: ghcr.io/cgr-chile/siante2-frontend:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
