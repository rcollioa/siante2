apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: siante2-test
resources:
  - secret.yml
  - backend/deployment.yml
  - backend/service.yml
  - frontend/deployment.yml
  - frontend/service.yml
  - ingress.yml

# Configuración del backend que no es secreta (las credenciales van en secret.yml). Kustomize agrega al
# nombre un hash del contenido y actualiza la referencia del deployment: cambiar un valor aquí reinicia
# los pods solo, sin "Restart" manual.
configMapGenerator:
  - name: siante2-config
    literals:
      - TZ=America/Santiago
      # Orígenes que pueden llamar a la API desde otro dominio, separados por coma (ver CorsConfig).
      - APP_CORS_ALLOWED_ORIGINS=
      # Opciones extra de la JVM. Vacío: el heap lo fija MaxRAMPercentage=75 del Dockerfile según
      # resources.limits.memory. Un -Xmx aquí lo reemplaza; si se usa, dejarlo bajo ese límite.
      - JAVA_OPTS=

# Versión desplegada: etiqueta inmutable (el SHA del commit que construyó la imagen), nunca :dev/:prod.
# El pipeline publica la imagen con esa etiqueta y actualiza newTag con un commit; Argo CD despliega al
# ver el cambio, y volver a una versión anterior es revertir ese commit.
images:
  - name: ghcr.io/cgr-chile/siante2-backend
    newTag: REEMPLAZAR_POR_SHA
  - name: ghcr.io/cgr-chile/siante2-frontend
    newTag: REEMPLAZAR_POR_SHA
