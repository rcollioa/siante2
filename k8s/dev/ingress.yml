apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siante2
  namespace: sisgeob-test
spec:
  ingressClassName: nginx
  rules:
    - host: siante2.dev-qa.tanzu.contraloria.cl
      http:
        paths:
          - path: /siante2/api
            pathType: Prefix
            backend:
              service:
                name: siante2-backend-test
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siante2-frontend-test
                port:
                  number: 80
