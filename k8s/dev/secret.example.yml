# Plantilla del secreto. El secreto real (secret.yml, ignorado por git) lo define Ingeniería: copiar
# este archivo como secret.yml y completar los valores, o cifrarlo con sops (ver .sops.yaml).
# Solo credenciales: la configuración que no es secreta (TZ, CORS, JAVA_OPTS) va en configMapGenerator
# de kustomization.yml.
apiVersion: v1
kind: Secret
metadata:
  name: siante2-secret
  namespace: siante2-test
type: Opaque
stringData:
  APP_DATASOURCE_URL: "jdbc:oracle:thin:@//HOST:1521/SERVICIO"
  APP_DATASOURCE_USERNAME: "USUARIO"
  APP_DATASOURCE_PASSWORD: "CLAVE"
