apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siante2
  namespace: siante2-prod
spec:
  ingressClassName: nginx
  rules:
    - host: siante2.tanzu.contraloria.cl
      http:
        paths:
          # Debe coincidir con app.api.prefijo del backend y API_PREFIJO del frontend.
          - path: /siante2/api
            pathType: Prefix
            backend:
              service:
                name: siante2-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siante2-frontend
                port:
                  number: 80
