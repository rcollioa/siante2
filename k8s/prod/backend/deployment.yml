apiVersion: apps/v1
kind: Deployment
metadata:
  name: siante2-backend
  namespace: sisgeob-prod
  labels:
    app: siante2-backend
spec:
  # Dos réplicas sin estado propio: un despliegue o reinicio deja siempre una atendiendo.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: siante2-backend
  template:
    metadata:
      labels:
        app: siante2-backend
    spec:
      imagePullSecrets:
        - name: ghcr.io
      containers:
        - name: backend
          image: ghcr.io/cgr-chile/siante2-backend:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: TZ
              value: America/Santiago
          envFrom:
            - secretRef:
                name: siante2-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          # Spring Boot tarda en arrancar: hasta 30 x 5 s = 150 s antes de evaluar las otras probes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness no mira la base: reiniciar el pod no la arregla y su caída ya responde 503.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
