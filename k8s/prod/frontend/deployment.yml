apiVersion: apps/v1
kind: Deployment
metadata:
  name: siante2-frontend
  namespace: siante2-prod
  labels:
    app: siante2-frontend
spec:
  # Dos réplicas: un despliegue o un reinicio deja siempre una atendiendo.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: siante2-frontend
  template:
    metadata:
      labels:
        app: siante2-frontend
    spec:
      # Sin token de la API de Kubernetes montado: la aplicación no la usa.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr.io
      containers:
        - name: frontend
          image: ghcr.io/cgr-chile/siante2-frontend
          imagePullPolicy: IfNotPresent
          # Sistema de archivos de solo lectura y sin privilegios: si alguien llega a ejecutar código en el
          # contenedor, no puede modificar la aplicación ni escalar a root. Solo /tmp es escribible.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # Con readOnlyRootFilesystem, nginx escribe ahí el pid y sus archivos temporales.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
