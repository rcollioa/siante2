apiVersion: apps/v1
kind: Deployment
metadata:
  name: siante2-frontend
  namespace: sisgeob-prod
  labels:
    app: siante2-frontend
spec:
  # nginx sirviendo archivos estáticos: sin estado, se replica sin más.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: siante2-frontend
  template:
    metadata:
      labels:
        app: siante2-frontend
    spec:
      imagePullSecrets:
        - name: ghcr.io
      containers:
        - name: frontend
          image: ghcr.io/cgr-chile/siante2-frontend:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
